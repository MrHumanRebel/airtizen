name: Validate, build and release AirTizen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airtizen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Build and test native receiver
        run: |
          set -euo pipefail
          ./scripts/build-local.sh
          ctest --test-dir native/build --output-on-failure
          python3 tests/test_release.py
          node --check app/js/share.js
          node --check app/js/video.js
          node --check app/js/platform.js
          node --check app/js/app.js
          node --check app/js/native-bridge.js
          npx --yes acorn@8.15.0 --ecma5 app/js/share.js > /dev/null
          npx --yes acorn@8.15.0 --ecma5 app/js/video.js > /dev/null
          npx --yes acorn@8.15.0 --ecma5 app/js/platform.js > /dev/null
          npx --yes acorn@8.15.0 --ecma5 app/js/app.js > /dev/null
          npx --yes acorn@8.15.0 --ecma5 app/js/native-bridge.js > /dev/null
      - name: Browser integration tests
        run: |
          set -euo pipefail
          python3 -m playwright install --with-deps chromium
          python3 tests/test_gui.py
          python3 tests/test_mirror_gui.py
          python3 tests/test_share_gui.py
      - name: Address and undefined behavior sanitizers
        run: |
          set -euo pipefail
          cmake -S native -B /tmp/airtizen-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build /tmp/airtizen-asan -j2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir /tmp/airtizen-asan --output-on-failure

  signed-wgt:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TIZEN_STUDIO_VER: 4.5.1
      TIZEN_PROFILE_NAME: AirTizen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require configured signing identity
        env:
          CERT: ${{ secrets.TIZEN_CERT_P12_BASE64 }}
          PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
          DISTRIBUTOR: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          set -euo pipefail
          for required in CERT PASSWORD DISTRIBUTOR DISTRIBUTOR_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "::error::Configure author and Samsung TV distributor certificates/passwords. No unsigned release fallback is permitted."
              exit 1
            fi
          done
      - name: Calculate version and stage UI
        id: version
        run: |
          set -euo pipefail
          version="$(python3 scripts/version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 scripts/stage-web.py "$RUNNER_TEMP/airtizen-web" "$version"
      - name: Install verified official Tizen Web CLI
        env:
          AIRTIZEN_TIZEN_USER_ROOT: ${{ runner.temp }}/tizen-user
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip
          bash scripts/install-tizen-web-cli.sh
          echo "TIZEN_STUDIO_ROOT=$AIRTIZEN_TIZEN_USER_ROOT/tizen-studio" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=-Duser.home=$AIRTIZEN_TIZEN_USER_ROOT" >> "$GITHUB_ENV"
      - name: Configure signing and build signed WGT
        env:
          TIZEN_CERT_P12_BASE64: ${{ secrets.TIZEN_CERT_P12_BASE64 }}
          TIZEN_CERT_PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
          TIZEN_DISTRIBUTOR_P12_BASE64: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: bash scripts/build-signed-wgt.sh "$RUNNER_TEMP/airtizen-web" "$GITHUB_WORKSPACE/app/release"
      - name: Verify signed package and generate checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tests/test_wgt_crypto.py app/release/AirTizen.wgt "$TIZEN_STUDIO_ROOT/jdk"
          cd app/release
          sha256sum AirTizen.wgt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AirTizen-${{ steps.version.outputs.version }}-signed-wgt
          path: |
            app/release/AirTizen.wgt
            app/release/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [validate, signed-wgt]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.signed-wgt.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name "AirTizen-$VERSION-signed-wgt" --dir release
      - name: Publish experimental release without moving existing tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.signed-wgt.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          cd ..
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists; leaving its artifacts unchanged."
            exit 0
          fi
          gh release create "v$VERSION" release/AirTizen.wgt release/SHA256SUMS \
            --target "$COMMIT" --prerelease --title "AirTizen $VERSION (experimental)" \
            --notes-file docs/RELEASE_NOTES.md
